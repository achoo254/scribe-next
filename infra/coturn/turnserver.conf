# coturn cho OneScribe meeting (Phase 5) — TURN relay qua NAT/firewall doanh nghiệp.
# Cài NATIVE: sudo apt install coturn  → sửa /etc/turnserver.conf theo file này → systemctl enable --now coturn
#
# [TURN] Ephemeral credential (REST API) — KHÔNG credential tĩnh. static-auth-secret PHẢI khớp
# TURN_SECRET của meeting-server (nó sinh username/password HMAC hết hạn ~5'). Lộ secret tĩnh →
# TURN bị lạm dụng làm open proxy.

listening-port=3478
tls-listening-port=5349

# Dải cổng relay — mở đúng dải này ở cloud security-group (UDP).
min-port=49160
max-port=49200

# Xác thực bằng shared secret (time-limited), KHÔNG user/pass tĩnh.
use-auth-secret
static-auth-secret=CHANGE_ME_KHOP_TURN_SECRET_CUA_MEETING_SERVER

# realm + IP công khai (thay bằng domain/IP thật của server).
realm=tunnel.inetdev.io.vn
# external-ip=<PUBLIC_IP>            # bỏ comment + điền IP public nếu sau NAT

# TLS (dùng chung cert Let's Encrypt với nginx/caddy nếu có).
# cert=/etc/letsencrypt/live/tunnel.inetdev.io.vn/fullchain.pem
# pkey=/etc/letsencrypt/live/tunnel.inetdev.io.vn/privkey.pem

# Hardening: chặn IP nội bộ (SSRF/scan), tắt CLI telnet.
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Cho phép chính LiveKit (nếu cùng máy) — nới đúng IP cần, KHÔNG mở toàn bộ.
allowed-peer-ip=127.0.0.1

fingerprint
stale-nonce=600
