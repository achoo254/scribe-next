# LiveKit config (Phase 2 dev) — chạy NATIVE trên WSL Ubuntu, KHÔNG Docker.
# Chạy nhanh (bỏ qua file này): livekit-server --dev   (key=devkey, secret=secret, port 7880)
# Chạy theo config này:          livekit-server --config livekit.yaml --bind 0.0.0.0
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  # Dải UDP cho WebRTC. WSL2 ↔ Windows: port nghe trên 0.0.0.0 thường forward localhost tự động;
  # UDP range có thể cần netsh portproxy / fallback TCP khi test máy thật (xem docs/deployment-guide.md).
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  use_external_ip: false
keys:
  # ⚠️ DEV ONLY — cặp này trùng default công khai của `livekit-server --dev`, KHÔNG phải secret thật.
  # BẮT BUỘC đổi key:secret ngẫu nhiên TRƯỚC KHI lên staging/production (Phase 5 = token-service auth thật).
  devkey: secret
