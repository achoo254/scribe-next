# XcodeGen — sinh OneScribeSpike.xcodeproj xác định được, không cần commit .xcodeproj vào git.
#   brew install xcodegen && cd ios-spike && xcodegen generate
name: OneScribeSpike
options:
  bundleIdPrefix: vn.inet.onescribe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  OneScribeSpike:
    type: application
    platform: iOS
    sources:
      - path: OneScribeSpike
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.inet.onescribe.spike
        PRODUCT_NAME: OneScribeSpike
        INFOPLIST_FILE: OneScribeSpike/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Swift 5 language mode: spike dùng NSLock + DispatchQueue thủ công cho audio thread,
        # không theo strict concurrency của Swift 6.
        SWIFT_VERSION: "5.0"
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        # Để trống DEVELOPMENT_TEAM → Xcode hỏi chọn Personal Team (Apple ID cá nhân) lần đầu mở.
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
