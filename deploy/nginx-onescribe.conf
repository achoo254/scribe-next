# OneScribe Web vhost — cài: /etc/nginx/conf.d/onescribe.conf trên .65 (nginx SHARED — chỉ THÊM
# server block này, KHÔNG sửa vhost khác). `nginx -t` trước khi reload.
#
# Mô hình: CF DNS proxied scribe.inetdev.io.vn → .65. CF lo TLS ở edge.
#   - Nếu zone SSL = Flexible: CF↔origin = HTTP → block listen 80 dưới đây là đủ.
#   - Nếu zone SSL = Full/Full(strict): CF↔origin = HTTPS → CẦN thêm block listen 443 ssl + cert
#     origin (dùng cert wildcard sẵn có của box hoặc CF Origin Cert). Xác nhận SSL mode trước deploy.
#
# LƯU Ý: .65 shared → KHÔNG firewall :80 chỉ-cho-CF được (sẽ chặn 15 vhost khác). set_real_ip_from
# dưới đây chỉ để lấy đúng client IP (rate-limit Phase 5); origin-bypass chấp nhận, phòng thủ abuse
# dồn sang quota + size cap + audit-log (Phase 5).

server {
    listen 80;
    listen [::]:80;
    server_name scribe.inetdev.io.vn;

    # Client IP thật từ Cloudflare (dải CF: https://www.cloudflare.com/ips/).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Upload lớn (Phase 3/4) — cắt/ghi file media.
    client_max_body_size 500M;

    # API → BE axum localhost. Tắt buffering cho upload/stream (chunked + progress).
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # FE static (Vue dist) — SPA fallback về index.html. Khớp convention box (/var/www/<app>).
    location / {
        root /var/www/onescribe/dist;
        try_files $uri $uri/ /index.html;
    }
}
