# Scribe Web vhost — cài: /etc/nginx/conf.d/scribe.conf trên .65 (nginx SHARED — chỉ THÊM
# server block này, KHÔNG sửa vhost khác). `nginx -t` trước khi reload.
#
# Mô hình: CF DNS proxied scribe.hoandat.com → .65, zone SSL "Full": CF↔origin là HTTPS, origin dùng
# chứng chỉ tự ký chung của box (/etc/pki/nginx/server.{crt,key}, như auth.hoandat.com). Cổng 80 chỉ
# chuyển hướng sang https.
# Kèm file include: nginx-scribe-security-headers.inc → /etc/nginx/scribe/security-headers.inc,
# nginx-scribe-locations.inc → /etc/nginx/scribe/locations.inc.
#
# LƯU Ý: .65 shared → KHÔNG firewall :80/:443 chỉ-cho-CF được (sẽ chặn các vhost khác). set_real_ip_from
# dưới đây chỉ để lấy đúng client IP (rate-limit, access log, audit); origin-bypass chấp nhận,
# phòng thủ abuse dồn sang hạn mức + size cap + audit-log.

server {
    listen 80;
    listen [::]:80;
    server_name scribe.hoandat.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scribe.hoandat.com;
    # Per-site access log: Tiểu Đệ's traffic ingest reads this file (tieu-de-next src/survival/traffic-ingest.ts).
    access_log /var/log/nginx/scribe.hoandat.com.access.log;

    ssl_certificate "/etc/pki/nginx/server.crt";
    ssl_certificate_key "/etc/pki/nginx/server.key";

    # Client IP thật từ Cloudflare (dải CF: https://www.cloudflare.com/ips/).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Header bảo mật (HSTS, CSP, …) — nguồn: nginx-scribe-security-headers.inc. Ở mức server cho
    # /api/ (không có add_header riêng nên thừa kế); /assets/ và / có add_header Cache-Control nên
    # phải include lại, nếu không nginx bỏ hết header của mức server.
    include /etc/nginx/scribe/security-headers.inc;

    # Upload lớn — cắt/ghi file media.
    client_max_body_size 500M;

    # /api/, web tĩnh, /assets/.
    include /etc/nginx/scribe/locations.inc;
}
