# scribe.<domain> của mọi tenant sổ của hoandat-auth → cùng scribe-be (127.0.0.1:8787) và cùng web tĩnh với
# scribe.hoandat.com (ADR 0001 của Scribe, ADR 0012 của auth-next). Cài: /etc/nginx/conf.d/scribe-tenants.conf trên .65
# (nginx SHARED — báo user trước, sao lưu, `nginx -T | grep -nE 'server_name\s+[^;]*~'` để chắc không block regex nào
# khác khớp `scribe.`, rồi `nginx -t` trước khi reload).
#
# - Block cụ thể `scribe.hoandat.com` (nginx-scribe.conf) luôn thắng block regex này.
# - Backend chọn tenant theo Host: host không phải tenant nào trả 404 `UNKNOWN_TENANT`, tenant chưa bật Scribe hiện
#   trang "Scribe chưa bật trên domain này".
# - Chứng chỉ: lineage riêng `scribe.<domain>` do provisioner của hoandat-auth cấp, chọn theo SNI qua map
#   `$tenant_cert` của 00-tenants-http.conf (hoandat-auth). Host chưa có chứng chỉ thì bắt tay TLS thất bại.
# - Cổng 80 (HTTP-01, Cloudflare Flexible) do tenants-acme.conf của hoandat-auth lo: request Flexible được chuyển tới
#   block 443 này qua loopback, nên tin 127.0.0.1 như các block tenant khác.
# - Cần /etc/nginx/scribe/security-headers.inc và /etc/nginx/scribe/locations.inc (cùng bộ với nginx-scribe.conf).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^scribe\.(?<tenant>.+)$;

    ssl_certificate     /etc/letsencrypt-tenants/live/$tenant_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tenants/live/$tenant_cert/privkey.pem;

    # IP người dùng: như Cloudflare báo (host proxied) hoặc như bước chuyển cổng 80 gửi qua loopback (Flexible). Khai ở
    # cấp server để không phụ thuộc cấu hình real-IP của app khác; danh sách cùng tenant-auth.conf của hoandat-auth.
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;

    # Header bảo mật ở mức server (cho /api/); /assets/ và / include lại trong locations.inc.
    include /etc/nginx/scribe/security-headers.inc;

    # Upload lớn — cắt/ghi file media (hạn mức gói free vẫn áp ở backend).
    client_max_body_size 500M;

    include /etc/nginx/scribe/locations.inc;
}
