<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The browser paints its default canvas in the OS scheme until the
		     stylesheet loads, so a dark OS never flashes white. theme-color is
		     set from the --c-bg token by src/lib/theme.ts. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Scribe · Ghi và cắt media</title>
		<script>
			// Apply the saved theme before first paint (key: THEME_STORAGE_KEY in src/lib/theme.ts).
			try {
				var theme = localStorage.getItem("scribe-theme");
				if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
			} catch (error) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
