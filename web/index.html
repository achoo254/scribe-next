<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The browser paints its default canvas in the OS scheme until the
		     stylesheet loads, so a dark OS never flashes white. theme-color is
		     set from the --c-bg token by src/lib/theme.ts. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>%APP_NAME% · Ghi âm và chép lời tiếng Việt</title>
		<!-- Applies the shared theme choice before first paint: the inline
		     script of @achoo254/app-shell (src/lib/theme-bootstrap.ts), put
		     here by vite.config.ts. Its sha256 is in the CSP. -->
		<!--theme-bootstrap-->
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
