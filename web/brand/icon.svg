<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Scribe app icon: sound wave (violet, primary) turning into transcript lines (plum, accent).
       Same drawing as BrandMark (src/components/brand/wordmark.tsx), dark-theme tokens of src/styles/tokens.css:
       bg #111113, primary #baa7ff / solid #6e56cf (violet), accent #e796f3 (plum).
       iOS AppIcon PNG = this drawing with a square, opaque background (iOS rounds the corners), like
       icon-maskable.svg. Edit both, then run pnpm brand:gen (brand.config.json "icon"). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1b22"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.36" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#6e56cf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6e56cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9baff"/>
      <stop offset="1" stop-color="#8b74e6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b4f8"/>
      <stop offset="1" stop-color="#d27ae0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <g fill="url(#wave)">
    <rect x="180.5" y="356.0" width="91.0" height="312.0" rx="45.5"/>
    <rect x="323.5" y="252.0" width="91.0" height="520.0" rx="45.5"/>
    <rect x="466.5" y="330.0" width="91.0" height="364.0" rx="45.5"/>
  </g>
  <g fill="url(#text)">
    <rect x="635.5" y="330.0" width="208.0" height="91.0" rx="45.5"/>
    <rect x="635.5" y="466.5" width="169.0" height="91.0" rx="45.5"/>
    <rect x="635.5" y="603.0" width="130.0" height="91.0" rx="45.5"/>
  </g>
</svg>
