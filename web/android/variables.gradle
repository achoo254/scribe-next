ext {
    minSdkVersion = 24
    // Google Play target API level, checked on developer.android.com on 23/10/2026: new apps and
    // updates must target Android 16 (API 36) since 31/08/2026 (docs/android-app.md). Raise both here.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // Auth Tab (AuthTabIntent) needs androidx.browser 1.9.0 or later.
    androidxBrowserVersion = '1.10.0'
    kotlinxCoroutinesVersion = '1.10.2'
    // WebSocket of the live transcript; tests use its MockWebServer.
    okhttpVersion = '4.12.0'
    // Real org.json for JVM unit tests (android.jar only has stubs).
    orgJsonVersion = '20240303'
}
