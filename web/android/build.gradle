// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Kotlin for the app's own plugins (app/src/main/java/com/hoandat/scribe), same version as
    // @shared-next/capacitor-system-auth.
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Every module takes the Kotlin standard library at the project's Kotlin version. Without this the
    // generated capacitor-cordova-android-plugins module's androidTest mixes kotlin-stdlib 1.8 with
    // kotlin-stdlib-jdk7/jdk8 1.6, which define the same classes (checkDebugAndroidTestDuplicateClasses).
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion rootProject.ext.kotlin_version
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
