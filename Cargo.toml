# Workspace Rust: server BE + crate cắt media thuần.
[workspace]
resolver = "2"
members = ["crates/core-split", "server/scribe-be"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
