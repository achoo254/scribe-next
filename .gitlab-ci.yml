# OneScribe Web — CI/CD build + deploy lên prod .65 (scribe.inetdev.io.vn)
#
# Biến cần cấu hình ở GitLab > Settings > CI/CD > Variables (chi tiết: docs/deploy-web-production.md):
#
#   [SSH deploy — .65]
#   SSH_PRIVATE_KEY   — nội dung PEM private key vào root@103.72.98.65 (protected; KHÔNG mask được vì multiline)
#   SERVER_IP         — 103.72.98.65
#   SERVER_PORT       — 24700
#   SSH_USER          — root
#
#   [Bake compile-time vào BE binary — build.rs đọc lúc build]
#   MONGO_URI         — Mongo URI prod (từ .65, thường mongodb://127.0.0.1:27017; protected + masked)
#   PORT              — 8787 (khớp systemd + nginx proxy)
#   # ALLOWED_DOMAINS / ALLOWED_EMAILS: KHÔNG set → fallback open (mọi email Google verified) — quyết định hiện tại.
#
# LƯU Ý .65 chặn SSH theo source-IP allowlist (iptables CP_SSH_ACL). Runner online: 103.57.222.245 (id=15).
# Deploy chỉ chạy trên `main`; build chạy mọi nhánh + MR để bắt lỗi sớm.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  GIT_STRATEGY: fetch
  # Giữ cache cargo + target qua các lần clean (build musl rất lâu nếu build lại từ đầu).
  GIT_CLEAN_FLAGS: -ffdx -e .cargo -e target

stages:
  - build
  - deploy

include:
  - local: '.gitlab/ci/templates/ssh-deploy.yml'

# =========================================================================
# BUILD — BE static musl binary (secret bake compile-time qua build.rs)
# Image rust-musl-cross đã cấu hình cross-toolchain musl cho ring/aws-lc → né đau build rustls.
# =========================================================================
be:build:
  stage: build
  image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
  timeout: 40m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  variables:
    CARGO_HOME: '$CI_PROJECT_DIR/.cargo'
  cache:
    key: cargo-musl
    paths:
      - .cargo/
      - target/
    policy: pull-push
  script:
    # MONGO_URI/PORT lấy từ CI/CD variables (auto-inject vào env job) → build.rs bake vào binary.
    - cargo build --release --target x86_64-unknown-linux-musl -p onescribe-be
    - ls -la target/x86_64-unknown-linux-musl/release/onescribe-be
    - file target/x86_64-unknown-linux-musl/release/onescribe-be || true
  artifacts:
    paths:
      - target/x86_64-unknown-linux-musl/release/onescribe-be
    expire_in: 30 min

# =========================================================================
# BUILD — FE (Vue 3 + Vite, npm) → web/dist
# =========================================================================
fe:build:
  stage: build
  image: harbor.000nethost.com/docker-hub/node:20-alpine
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  cache:
    key:
      files:
        - web/package-lock.json
      prefix: fe-npm
    paths:
      - web/node_modules/
    policy: pull-push
  script:
    - cd web
    - npm ci
    - npm run build # vue-tsc --noEmit && vite build
  artifacts:
    paths:
      - web/dist/
    expire_in: 30 min

# =========================================================================
# DEPLOY — rsync binary + FE dist sang .65, thay binary (atomic rename) rồi restart systemd.
# CHỈ main. KHÔNG đụng nginx/systemd unit (setup 1 lần thủ công — xem docs).
# =========================================================================
deploy:production:
  extends: .ssh_deploy_base
  stage: deploy
  needs: ['be:build', 'fe:build']
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - rsync -avz -e "ssh -p $SERVER_PORT" target/x86_64-unknown-linux-musl/release/onescribe-be "$SSH_USER@$SERVER_IP:/tmp/onescribe-be.new"
    - rsync -avz --delete -e "ssh -p $SERVER_PORT" web/dist/ "$SSH_USER@$SERVER_IP:/tmp/onescribe-fe/"
    - >-
      ssh -p "$SERVER_PORT" "$SSH_USER@$SERVER_IP"
      "set -e;
      install -o onescribe -g onescribe -m 700 /tmp/onescribe-be.new /opt/onescribe-be/onescribe-be.new;
      mv -f /opt/onescribe-be/onescribe-be.new /opt/onescribe-be/onescribe-be;
      rm -f /tmp/onescribe-be.new;
      mkdir -p /var/www/onescribe/dist;
      rsync -a --delete /tmp/onescribe-fe/ /var/www/onescribe/dist/;
      rm -rf /tmp/onescribe-fe;
      systemctl restart onescribe-be;
      sleep 2;
      systemctl is-active onescribe-be"
