[package]
name = "onescribe"
version = "0.2.1"
description = "OneScribe — ghi âm + cắt file + transcribe offline tiếng Việt"
authors = ["iNET"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "onescribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# macos-private-api: overlay chọn vùng ghi + viền dùng WebviewWindowBuilder::transparent — method
# này trên macOS chỉ tồn tại khi bật feature này (kèm app.macOSPrivateApi=true trong tauri.conf.json).
# Trên Windows feature nằm sau cfg(target_os="macos") nên vô hại (không đổi build/hành vi Windows).
[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Thuật toán cắt media dùng chung với server BE (Mode B). Path dep vì src-tauri exclude khỏi workspace.
core-split = { path = "../crates/core-split" }
cpal = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# OpenAI API key (nguồn chép cloud) lưu trong OS keychain — xem openai_key.rs.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Loopback (ghi tiếng output hệ thống) — Windows-only qua WASAPI.
# webview2-com/windows: hook PermissionRequested cấp quyền camera/mic cho getUserMedia trong WebView2
# (version khớp wry 0.55 → webview2-com 0.38 + windows 0.61, tránh lệch type ICoreWebView2).
[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_WinRT", "Win32_Foundation"] }

# libc: kill CẢ process group của sidecar (SIGKILL) khi HỦY/thoát — onefile PyInstaller đẻ tiến
# trình con (worker + resource_tracker); child.kill() lẻ để lại con mồ côi chạy ngầm.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Bật incremental cho release → rebuild (chỉ sửa code app) nhanh hơn nhiều.
# Đánh đổi: target/ phình to; binary tối ưu kém hơn không đáng kể (phần nặng nằm ở
# sidecar ffmpeg/whisper chạy process riêng, không phải trong binary Rust này).
[profile.release]
incremental = true
