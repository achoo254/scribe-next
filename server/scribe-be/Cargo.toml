[package]
name = "scribe-be"
edition.workspace = true
version.workspace = true
description = "Scribe Web backend (axum) — 1 static musl binary, self-hosted."

[[bin]]
name = "scribe-be"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
core-split = { path = "../../crates/core-split" }

axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }

# TLS out-bound = rustls (tránh OpenSSL/native-tls C lib → giữ musl static sạch).
# reqwest: fetch JWKS securetoken. mongodb 3.x mặc định dùng rustls.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
mongodb = "3"

jsonwebtoken = "9"
# OIDC hoandat-auth: băm token phiên, PKCE, mã hoá refresh token IdP của thiết bị (thuần Rust, musl sạch).
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
# Xoá bản rõ của key riêng người dùng khỏi bộ nhớ sau khi dùng (đã có sẵn trong cây phụ thuộc của aes-gcm).
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
infer = "0.16"
# Bỏ dấu tiếng Việt cho index tìm kiếm (NFD rồi bỏ dấu kết hợp); thuần Rust.
unicode-normalization = "0.1"
# zip deflate = flate2/miniz_oxide (pure Rust) → giữ musl static sạch (không C lib).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Xuất Word (.docx): MIT, thuần Rust; tắt `image` (không chèn ảnh) cho binary gọn.
docx-rs = { version = "0.4", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Sinh khoá ký ES256 tạm trong test OIDC (không commit khoá riêng).
ring = "0.17"
